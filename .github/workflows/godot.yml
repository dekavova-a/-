name: Godot - test and build Windows
on:
  push:
    branches: [main, godot-crown]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
env:
  GODOT_VERSION: 4.5.2
  GODOT_SILENCE_ROOT_WARNING: '1'
jobs:
  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cache official Godot binaries
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            .tools/godot
            ~/.local/share/godot/export_templates
          key: godot-linux-windows-${{ env.GODOT_VERSION }}
      - name: Install official Godot and matching export templates
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools/godot
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fL --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d .tools/godot
          mv ".tools/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" .tools/godot/godot
          chmod +x .tools/godot/godot
          curl -fL --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          python3 - <<'PY'
          import os, pathlib, zipfile
          target = pathlib.Path.home() / '.local/share/godot/export_templates' / (os.environ['GODOT_VERSION'] + '.stable')
          target.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile('/tmp/templates.tpz') as archive:
              for name in ('windows_release_x86_64.exe', 'version.txt'):
                  (target / name).write_bytes(archive.read('templates/' + name))
          PY
      - name: Import and run mission tests in Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          .tools/godot/godot --headless --path godot --editor --import --quit 2>&1 | tee build/reports/import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:' build/reports/import.log; then exit 1; fi
          .tools/godot/godot --headless --path godot --script res://tests/test_mission.gd 2>&1 | tee build/reports/tests.log
          if grep -Eq 'SCRIPT ERROR:|ERROR:|FAIL:' build/reports/tests.log; then exit 1; fi
          .tools/godot/godot --headless --path godot --script res://tests/test_input.gd 2>&1 | tee build/reports/input.log
          if grep -Eq 'SCRIPT ERROR:|ERROR:|FAIL:' build/reports/input.log; then exit 1; fi
      - name: Render actual gameplay screenshot
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          CROWN_CAPTURE_PATH: ${{ github.workspace }}/build/reports/gameplay.png
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          xvfb-run -a -s '-screen 0 1600x900x24' .tools/godot/godot --path godot --rendering-method gl_compatibility --audio-driver Dummy -- --capture
      - name: Build Windows executable
        run: |
          mkdir -p build/windows
          .tools/godot/godot --headless --path godot --export-release 'Windows Desktop' ../build/windows/AshesOfTheCrown.exe
          cp docs/PLAY_RU.txt build/windows/READ_ME.txt
          cp docs/GODOT_LICENSE.txt build/windows/GODOT_LICENSE.txt
          cp godot/assets/fonts/LICENSE.txt build/windows/FONT_LICENSE.txt
          cd build/windows
          zip -9 ../AshesOfTheCrown-Windows.zip AshesOfTheCrown.exe READ_ME.txt GODOT_LICENSE.txt FONT_LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AshesOfTheCrown-Windows
          path: build/AshesOfTheCrown-Windows.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Godot-validation-and-screenshot
          path: build/reports/
      - name: Publish downloadable Windows preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "godot-build-${GITHUB_RUN_NUMBER}" build/AshesOfTheCrown-Windows.zip --target "$GITHUB_SHA" --title "Пепел короны - Windows 0.2 (build ${GITHUB_RUN_NUMBER})" --notes-file docs/RELEASE_NOTES.md --prerelease
