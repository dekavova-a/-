name: Check prototype
on: [push, pull_request]
jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and simulation
        run: |
          node --check src/sim.js
          node --check src/render.js
          node --check src/app.js
          node --test tests/sim.test.cjs
      - name: Verify offline build
        run: |
          python3 build.py
          git diff --exit-code START_GAME.html
